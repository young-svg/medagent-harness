<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1140" viewBox="0 0 1640 1140" role="img" aria-labelledby="title description">
  <title id="title">MedAgent Harness Runtime Architecture — Release Version</title>
  <desc id="description">Release version. Corresponding runtime source is published on release/github-ready through PR #1. Three execution layers: W1 source-aligned semantic specification with independent review and program checks, LLM planning and deterministic contract policy; DAG-ready bounded Worker loops with parallel tasks or structured Handoff; Worker gates, conditional synthesis, safety edits, final structural coverage, per-request evidence and W2 semantic acceptance. Memory and Tools with optional RAG are separate context supports. Recovery, budgets and metadata causal tracing span execution. Model-assisted acceptance does not prove clinical correctness. W7 frozen evaluation interfaces are not part of this normal runtime flow.</desc>
  <!-- Editable SVG: native text, simple paths, no embedded image, font or external resource.
       Code correspondence (repository-relative):
       Specification: runtime/semantic_validation.py SemanticValidator.extract / contract_for_spec;
                      context/{request_spec,contract}.py; native_engine.analyze
       Planning: planning/planner.py Planner.plan / apply_contract_policy; planning/models.py
       Routing/scheduling: planning/router.py; runtime/native_engine.py analyze / run_subtask
       Workers/Handoff: runtime/agent_loop.py; runtime/handoff.py build_handoff
       Completion: runtime/acceptance.py FinalAcceptance.evaluate / finalize_answers;
                   runtime/coverage.py; native_engine._synthesize / _finalize_answers;
                   runtime/final_answers.py; guardrails/{sanitizer,contract_checker}.py
       Support: tools/registry.py; retrieval/query_builder.py; memory/session.py
       Cross-cutting: llm/generation.py; agent_loop._attempt_protocol_recovery;
                     observability/{tracer,privacy,replay}.py
       Dashed M / E paths are support/context interfaces, not execution stages.
       Diagram intentionally omits the downstream Presentation view transformation.
  -->
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b44; }
      .title { font-size: 34px; font-weight: 700; letter-spacing: -.7px; }
      .subtitle { font-size: 18px; fill: #627287; }
      .layer { fill: #f5f7fa; stroke: #e2e8f0; stroke-width: 1; }
      .card { fill: #fff; stroke: #cfd9e5; stroke-width: 1.4; }
      .llm { fill: #f0f5ff; stroke: #91b2ed; stroke-width: 1.5; }
      .section { font-size: 21px; font-weight: 700; }
      .number { font-size: 13px; font-weight: 700; fill: #356cbe; letter-spacing: 1px; }
      .heading { font-size: 24px; font-weight: 600; }
      .body { font-size: 22px; fill: #52657b; }
      .small { font-size: 20px; fill: #627287; }
      .tag { font-size: 12px; font-weight: 700; fill: #356cbe; letter-spacing: 1px; }
      .accent { fill: #2563b8; }
      .port { fill: #eaf1fc; stroke: #b7cceb; stroke-width: 1; }
      .port-text { font-size: 14px; font-weight: 700; fill: #2563b8; text-anchor: middle; }
      .flow { fill: none; stroke: #68829e; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .support { fill: none; stroke: #a2bad9; stroke-width: 1.8; stroke-dasharray: 6 6; stroke-linejoin: round; marker-end: url(#support-arrow); }
      .divider { stroke: #e2e8f0; stroke-width: 1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#68829e"/>
    </marker>
    <marker id="support-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1 L9 5 L2 9" fill="none" stroke="#a2bad9" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="1640" height="1140" fill="#fff"/>
  <text class="title" x="40" y="65">MedAgent Harness</text>
  <text class="subtitle" x="40" y="101">Task Contract → planned work → verified delivery</text>
  <text class="tag" x="1598" y="65" text-anchor="end">RELEASE VERSION</text>

  <!-- 01: LLM proposals are not the final executable plan. -->
  <g id="task-specification-planning">
    <rect class="layer" x="40" y="137" width="1280" height="200" rx="16"/>
    <text class="number" x="70" y="167">01</text>
    <text class="section" x="105" y="167">Task Contract &amp; Planning</text>
    <rect class="card" x="70" y="190" width="360" height="120" rx="12"/>
    <text class="tag" x="90" y="210">MODEL + PROGRAM CHECKS</text>
    <text class="heading" x="90" y="240">Task Contract</text>
    <text class="body" x="90" y="270">RequestSpec + AnswerContract</text>
    <text class="small" x="90" y="298">Source spans · priorities · scope</text>

    <path class="flow" d="M430 250 H480"/>
    <rect class="llm" x="480" y="190" width="270" height="120" rx="12"/>
    <text class="tag" x="500" y="210">LLM PROPOSAL</text>
    <text class="heading" x="500" y="240">Planner</text>
    <text class="body" x="500" y="270">Tasks + dependencies</text>
    <text class="small" x="500" y="298">RQ ownership</text>
    <rect class="port" x="707" y="200" width="28" height="25" rx="6"/>
    <text class="port-text" x="721" y="218">M</text>

    <path class="flow" d="M750 250 H800"/>
    <rect class="card" x="800" y="190" width="490" height="120" rx="12"/>
    <text class="tag" x="820" y="210">DETERMINISTIC POLICY</text>
    <text class="heading" x="820" y="240">Policy + DAG validation</text>
    <text class="body" x="820" y="270">Scope + required ownership</text>
    <text class="small" x="820" y="298">Validate graph before dispatch</text>
  </g>

  <!-- Policy -> Router/Scheduler -> Worker loops. Middle layer flows right to left. -->
  <text class="small" x="1160" y="358">validated plan</text>
  <g id="runtime-orchestration">
    <rect class="layer" x="40" y="378" width="1280" height="245" rx="16"/>
    <text class="number" x="70" y="407">02</text>
    <text class="section" x="105" y="407">Dependency-aware Execution</text>
    <rect class="card" x="1005" y="432" width="285" height="165" rx="12"/>
    <text class="tag" x="1025" y="458">PROGRAM CONTROL</text>
    <text class="heading" x="1025" y="489">DAG Scheduler</text>
    <text class="body" x="1025" y="517">Run ready tasks</text>
    <text class="body" x="1025" y="546">Wait outside slots</text>
    <text class="small" x="1025" y="573">Bad upstream → blocked</text>
    <text class="small" x="975" y="501" text-anchor="middle" style="font-size:12px">ready</text>
    <text class="small" x="975" y="518" text-anchor="middle" style="font-size:12px">tasks</text>
    <path class="flow" d="M1005 535 H945"/>

    <rect class="llm" x="70" y="432" width="875" height="165" rx="12"/>
    <text class="heading" x="90" y="462">Worker loops · LLM + Tools</text>
    <rect class="port" x="861" y="445" width="28" height="25" rx="6"/>
    <text class="port-text" x="875" y="463">M</text>
    <rect class="port" x="900" y="565" width="28" height="25" rx="6"/>
    <text class="port-text" x="914" y="583">E</text>
    <text class="body" x="90" y="496">Independent</text>
    <path class="flow" d="M270 491 H320"/>
    <text class="body" x="340" y="496">Concurrent bounded loops</text>
    <line class="divider" x1="90" y1="514" x2="925" y2="514"/>
    <text class="body" x="90" y="544">Upstream</text>
    <path class="flow" d="M270 539 H320"/>
    <text class="body accent" x="340" y="544">Structured Handoff</text>
    <path class="flow" d="M550 539 H600"/>
    <text class="body" x="620" y="544">Dependent</text>
    <text class="small" x="90" y="577">Validated public answers + provenance; not new patient facts.</text>
  </g>
  <path class="flow" d="M1145 310 V432"/>
  <!-- Enter completion only after Worker-level coverage and dependency checks. -->

  <g id="completion-verification">
    <rect class="layer" x="40" y="664" width="1280" height="226" rx="16"/>
    <text class="number" x="70" y="693">03</text>
    <text class="section" x="105" y="693">Completion &amp; Verification</text>
    <rect class="card" x="70" y="718" width="230" height="145" rx="12"/>
    <text class="heading" x="88" y="747">Worker gates</text>
    <text class="body" x="88" y="777">RQ + Contract</text>
    <text class="body" x="88" y="806">Evidence + DAG</text>
    <text class="small" x="88" y="841">Fail → incomplete</text>
    <path class="flow" d="M300 779 H340"/>

    <rect class="llm" x="340" y="718" width="300" height="145" rx="12"/>
    <text class="heading" x="358" y="747">Conditional synthesis</text>
    <text class="body" x="358" y="777">Single → direct</text>
    <text class="body" x="358" y="806">Multiple → Synthesis</text>
    <text class="small" x="358" y="841">Only after Worker gates</text>
    <path class="flow" d="M640 779 H680"/>

    <rect class="card" x="680" y="718" width="245" height="145" rx="12"/>
    <text class="heading" x="698" y="747">Safety edits</text>
    <text class="body" x="698" y="779">Sanitize + Guardrail</text>
    <text class="body" x="698" y="804">Per-RQ fallback</text>
    <text class="body" x="698" y="829">Recheck hard blocks</text>
    <path class="flow" d="M925 779 H965"/>

    <rect class="llm" x="965" y="718" width="325" height="145" rx="12" style="fill:#fff;stroke:#91b2ed"/>
    <text class="heading" x="983" y="747">Final verification</text>
    <text class="body" x="983" y="777">Structure + Evidence</text>
    <text class="body" x="983" y="806">Semantic acceptance</text>
    <text class="body accent" x="983" y="841">Final Answer + status</text>
  </g>
  <path class="flow" d="M70 566 H54 V779 H70"/>
  <text x="70" y="922" font-size="18" font-weight="600">Acceptance checks ≠ clinical validation.</text>

  <!-- Support paths route through gutters, never through execution cards.
       M: same read-time history snapshot, shared by Planner and Workers.
       E: tool results / compact admitted external evidence enter AgentLoop.
  -->
  <g id="support-context-interfaces">
    <rect class="card" x="70" y="949" width="590" height="112" rx="12"/>
    <rect class="port" x="90" y="968" width="28" height="25" rx="6"/>
    <text class="port-text" x="104" y="986">M</text>
    <text class="heading" x="132" y="989">Session Memory</text>
    <text class="body" x="90" y="1018">Bounded history for model stages</text>
    <text class="small" x="90" y="1043">Session-local · one shared snapshot</text>

    <rect class="card" x="690" y="949" width="600" height="112" rx="12"/>
    <rect class="port" x="710" y="968" width="28" height="25" rx="6"/>
    <text class="port-text" x="724" y="986">E</text>
    <text class="heading" x="752" y="989">Tools / optional RAG</text>
    <text class="body" x="710" y="1018">Permissions · schemas · attempt limits</text>
    <text class="small" x="710" y="1043">RQ retrieval → admitted sources → citations</text>
  </g>

  <!-- Cross-cutting mechanisms; no claim of a new autonomous recovery Agent. -->
  <g id="cross-cutting-capabilities">
    <rect x="1360" y="137" width="240" height="924" rx="16" fill="#f8fafc" stroke="#d5dfeb"/>
    <text class="tag" x="1382" y="169">CROSS-CUTTING</text>
    <text class="small" x="1382" y="194">Across execution stages</text>
    <line class="divider" x1="1382" y1="215" x2="1578" y2="215"/>
    <text class="heading" x="1382" y="258" style="font-size:22px">Budget / Recovery</text>
    <text class="body" x="1382" y="292">Attempt limits</text>
    <text class="body" x="1382" y="326">Timeouts</text>
    <text class="body" x="1382" y="360">Bounded repair</text>
    <text class="small" x="1382" y="412">No tool-ID replay.</text>
    <text class="small" x="1382" y="436">No replanning.</text>
    <line class="divider" x1="1382" y1="459" x2="1578" y2="459"/>
    <text class="heading" x="1382" y="506">Causal Trace</text>
    <text class="body" x="1382" y="540">Parent / source IDs</text>
    <text class="body" x="1382" y="574">Timing + usage</text>
    <text class="body" x="1382" y="608">Dependency graph</text>
    <text class="small" x="1382" y="650">Summary / Replay</text>
    <text class="small" x="1382" y="692">Causal links, not order.</text>
    <line class="divider" x1="1382" y1="718" x2="1578" y2="718"/>
    <text class="small" x="1382" y="760">Metadata default</text>
    <text class="small" x="1382" y="784">IDs, status, usage</text>
    <text class="small" x="1382" y="834">Raw may contain text</text>
    <text class="small" x="1382" y="858">Keep raw local.</text>
  </g>
  <g id="support-relationships">
    <path class="support" d="M90 980 H20 V178 H721 V200"/>
    <path class="support" d="M20 420 H875 V445"/>
    <path class="support" d="M724 968 V936 H1338 V612 H914 V590"/>
  </g>
  <text class="small" x="70" y="1105">Solid: control flow. Dashed: context. LLM generation is bounded by program checks.</text>
</svg>
