[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medagent-harness"
version = "1.0.0"
description = "A traceable clinical-domain planner-worker agent harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "pydantic>=2.6,<3", "uvicorn>=0.27,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1"]

[project.scripts]
medagent = "medagent.cli:main"

[tool.setuptools.packages.find]
include = ["medagent*", "api*"]

[tool.pytest.ini_options]
addopts = "-q"
markers = ["integration: requires an external service"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

